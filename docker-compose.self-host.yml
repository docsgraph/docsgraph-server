# Docker Compose configuration for self-hosting docsgraph-server.
#
# To start the full stack, run:
#   docker compose -f docker-compose.self-host.yml up --build -d

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docsgraph}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docsgraph}
      POSTGRES_DB: ${POSTGRES_DB:-docsgraph}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-docsgraph} -d $${POSTGRES_DB:-docsgraph}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  db-migrate:
    build: .
    command: alembic upgrade head
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docsgraph}:${POSTGRES_PASSWORD:-docsgraph}@postgres:5432/${POSTGRES_DB:-docsgraph}
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_ENV: production
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      LOG_LEVEL: info
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docsgraph}:${POSTGRES_PASSWORD:-docsgraph}@postgres:5432/${POSTGRES_DB:-docsgraph}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_ALGORITHM: HS256
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: 60
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  worker:
    build: .
    command: arq docsgraph_server.jobs.worker.WorkerSettings
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docsgraph}:${POSTGRES_PASSWORD:-docsgraph}@postgres:5432/${POSTGRES_DB:-docsgraph}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    depends_on:
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
  redis-data:
